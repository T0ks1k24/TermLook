name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi librsvg2-common gir1.2-gtk-3.0 gir1.2-vte-2.91 gir1.2-ayatanaappindicator3-0.1 xvfb xauth dbus-x11
      - name: Check Python and shell syntax
        run: |
          /usr/bin/python3 -m compileall -q termlook scripts tests
          sh -n scripts/snap_launch.sh
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: GTK and VTE lifecycle regression
        env:
          G_DEBUG: fatal-criticals
          GSETTINGS_BACKEND: memory
          NO_AT_BRIDGE: '1'
        run: |
          timeout 90s dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/smoke_gui.py
          timeout 90s dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/smoke_lazy.py

  deb:
    name: DEB build
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Debian package
        run: /usr/bin/python3 scripts/build_deb.py
      - name: Install and validate package
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/termlook_*_all.deb xvfb xauth xdotool dbus-x11 desktop-file-utils
          desktop-file-validate /usr/share/applications/io.termlook.TermLook.desktop
          cd /tmp
          G_DEBUG=fatal-criticals GSETTINGS_BACKEND=memory NO_AT_BRIDGE=1 timeout 90s dbus-run-session -- xvfb-run -a /usr/bin/python3 "$GITHUB_WORKSPACE/tests/smoke_snap.py" --deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: termlook-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
